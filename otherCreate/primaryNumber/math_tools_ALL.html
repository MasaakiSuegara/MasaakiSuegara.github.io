<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <title>数学ツール</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --panel: #141414;
            --border: #2a2a2a;
            --accent: #00ff88;
            --accent2: #ff6b35;
            --accent3: #4fc3f7;
            --text: #e0e0e0;
            --dim: #666;
            --mono: 'Share Tech Mono', monospace;
            --sans: 'Noto Sans JP', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            min-height: 100vh;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

        header { text-align: center; padding: 40px 0 32px; }
        header h1 {
            font-family: var(--mono);
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            color: var(--accent);
            letter-spacing: 0.15em;
            text-shadow: 0 0 20px rgba(0,255,136,0.4);
        }
        header p { color: var(--dim); font-size: 0.85rem; margin-top: 8px; font-family: var(--mono); }

        .tabs {
            display: flex; gap: 4px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .tab-btn {
            font-family: var(--mono); font-size: 0.8rem;
            padding: 10px 18px;
            background: transparent;
            border: 1px solid transparent; border-bottom: none;
            color: var(--dim); cursor: pointer;
            letter-spacing: 0.1em; transition: all 0.2s;
            position: relative; bottom: -1px;
        }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active { color: var(--accent); border-color: var(--border); border-bottom-color: var(--bg); background: var(--panel); }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 28px; }
        .panel-title { font-family: var(--mono); font-size: 0.75rem; color: var(--accent); letter-spacing: 0.2em; margin-bottom: 20px; }

        .input-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }

        input[type="number"], input[type="text"], select {
            background: var(--bg); border: 1px solid var(--border);
            color: var(--text); font-family: var(--mono); font-size: 1rem;
            padding: 10px 14px; border-radius: 3px; outline: none;
            transition: border-color 0.2s; flex: 1; min-width: 120px;
        }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,255,136,0.1); }

        button {
            font-family: var(--mono); font-size: 0.85rem;
            padding: 10px 20px; border: 1px solid var(--accent);
            background: transparent; color: var(--accent);
            cursor: pointer; border-radius: 3px; letter-spacing: 0.1em;
            transition: all 0.2s; white-space: nowrap;
        }
        button:hover { background: var(--accent); color: var(--bg); }
        button.secondary { border-color: var(--accent2); color: var(--accent2); }
        button.secondary:hover { background: var(--accent2); color: var(--bg); }

        .result-box { background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 16px 20px; font-family: var(--mono); font-size: 0.9rem; min-height: 60px; line-height: 1.8; }
        .result-box .label { color: var(--dim); font-size: 0.75rem; margin-bottom: 6px; }
        .result-box .value { color: var(--accent); font-size: 1.1rem; word-break: break-all; }

        .base-results { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
        .base-card { background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 14px; }
        .base-card .base-label { font-family: var(--mono); font-size: 0.7rem; color: var(--dim); margin-bottom: 6px; }
        .base-card .base-value { font-family: var(--mono); font-size: 1rem; word-break: break-all; }
        .base-card.b2 .base-value { color: var(--accent); }
        .base-card.b8 .base-value { color: var(--accent3); }
        .base-card.b10 .base-value { color: var(--text); }
        .base-card.b16 .base-value { color: var(--accent2); }

        .factor-display { margin-top: 16px; }
        .factor-equation { font-family: var(--mono); font-size: 1.1rem; color: var(--text); margin-bottom: 12px; }
        .factor-equation span.num { color: var(--accent); }

        .prime-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .prime-badge {
            font-family: var(--mono); font-size: 0.8rem;
            padding: 4px 12px; border: 1px solid var(--accent2);
            border-radius: 2px; color: var(--accent2);
            animation: fadeIn 0.3s ease forwards; opacity: 0;
        }
        @keyframes fadeIn { to { opacity: 1; } }

        .prime-verdict { font-family: var(--mono); font-size: 1.3rem; margin-top: 12px; padding: 16px; border-radius: 3px; text-align: center; }
        .prime-verdict.is-prime { border: 1px solid var(--accent); color: var(--accent); background: rgba(0,255,136,0.05); }
        .prime-verdict.not-prime { border: 1px solid var(--accent2); color: var(--accent2); background: rgba(255,107,53,0.05); }

        .game-area { text-align: center; }
        .big-number {
            font-family: var(--mono); font-size: clamp(3rem, 10vw, 6rem);
            color: var(--accent); text-shadow: 0 0 30px rgba(0,255,136,0.5);
            margin: 24px 0; letter-spacing: 0.1em; transition: all 0.3s;
        }
        .big-number.revealing { animation: glitch 0.4s ease; }
        @keyframes glitch {
            0%   { transform: translateX(0);   color: var(--accent); }
            20%  { transform: translateX(-3px); color: var(--accent2); }
            40%  { transform: translateX(3px);  color: var(--accent3); }
            60%  { transform: translateX(-2px); color: var(--accent); }
            100% { transform: translateX(0); }
        }

        .game-answer { font-family: var(--mono); font-size: 1rem; color: var(--dim); margin-top: 16px; min-height: 28px; }
        .game-answer.show { color: var(--accent2); font-size: 1.3rem; }
        .game-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .hint-text { font-size: 0.8rem; color: var(--dim); margin-top: 12px; font-family: var(--mono); }

        .sep { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
        label { font-family: var(--mono); font-size: 0.75rem; color: var(--dim); display: block; margin-bottom: 6px; }
        .field { margin-bottom: 16px; }
        .err { color: #ff5555; font-family: var(--mono); font-size: 0.85rem; margin-top: 8px; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>// MATH_TOOLS.js</h1>
        <p>進数変換 / 素数判定 / 因数分解</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('base', this)">進数変換</button>
        <button class="tab-btn" onclick="switchTab('prime', this)">素数判定</button>
        <button class="tab-btn" onclick="switchTab('factor', this)">因数分解</button>
        <button class="tab-btn" onclick="switchTab('game', this)">ランダム遊び</button>
    </div>

    <!-- 進数変換 -->
    <div class="tab-panel active" id="tab-base">
        <div class="panel">
            <p class="panel-title">// BASE_CONVERTER</p>
            <div class="field">
                <label>変換したい数値を入力</label>
                <div class="input-row">
                    <input type="text" id="baseInput" placeholder="例: 255 または FF または 11111111">
                    <select id="fromBase">
                        <option value="10">10進数</option>
                        <option value="2">2進数</option>
                        <option value="8">8進数</option>
                        <option value="16">16進数</option>
                    </select>
                    <button onclick="convertBase()">変換</button>
                </div>
            </div>
            <div class="base-results">
                <div class="base-card b2">
                    <div class="base-label">2進数 (Binary)</div>
                    <div class="base-value" id="res2">—</div>
                </div>
                <div class="base-card b8">
                    <div class="base-label">8進数 (Octal)</div>
                    <div class="base-value" id="res8">—</div>
                </div>
                <div class="base-card b10">
                    <div class="base-label">10進数 (Decimal)</div>
                    <div class="base-value" id="res10">—</div>
                </div>
                <div class="base-card b16">
                    <div class="base-label">16進数 (Hex)</div>
                    <div class="base-value" id="res16">—</div>
                </div>
            </div>
            <div class="err" id="baseError"></div>
        </div>
    </div>

    <!-- 素数判定 -->
    <div class="tab-panel" id="tab-prime">
        <div class="panel">
            <p class="panel-title">// PRIME_CHECKER</p>
            <div class="field">
                <label>調べたい自然数を入力</label>
                <div class="input-row">
                    <input type="number" id="primeInput" placeholder="例: 97" min="1">
                    <button onclick="checkPrime()">判定</button>
                </div>
            </div>
            <div id="primeVerdict"></div>
            <hr class="sep">
            <p class="panel-title">// PRIME_LIST — 指定した数以下の素数を列挙</p>
            <div class="field">
                <label>上限を入力（最大1000）</label>
                <div class="input-row">
                    <input type="number" id="primeListInput" placeholder="例: 100" min="2" max="1000">
                    <button onclick="listPrimes()">列挙</button>
                </div>
            </div>
            <div class="result-box">
                <div class="label">結果</div>
                <div class="value" id="primeListValue">—</div>
            </div>
        </div>
    </div>

    <!-- 因数分解 -->
    <div class="tab-panel" id="tab-factor">
        <div class="panel">
            <p class="panel-title">// FACTORIZER</p>
            <div class="field">
                <label>因数分解したい自然数を入力</label>
                <div class="input-row">
                    <input type="number" id="factorInput" placeholder="例: 360" min="2">
                    <button onclick="doFactorize()">分解</button>
                </div>
            </div>
            <div class="factor-display" id="factorDisplay"></div>
        </div>
    </div>

    <!-- ランダム遊び -->
    <div class="tab-panel" id="tab-game">
        <div class="panel">
            <p class="panel-title">// RANDOM_FACTORIZER — この数を因数分解できる？</p>
            <div class="game-area">
                <div class="big-number" id="gameNumber">?</div>
                <div class="game-answer" id="gameAnswer">ボタンを押してスタート</div>
                <div class="hint-text" id="gameHint"></div>
                <div class="game-buttons">
                    <button onclick="generateRandom()">ランダム生成</button>
                    <button class="secondary" onclick="revealAnswer()">答えを見る</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    'use strict';

    // ============================================================
    // タブ切り替え
    // ============================================================
    function switchTab(name, btn) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        btn.classList.add('active');
    }

    // ============================================================
    // 進数変換
    // parseInt(文字列, 元の進数) で10進数に変換
    // (数値).toString(変換先の進数) で文字列に変換
    // ============================================================
    function convertBase() {
        const input = document.getElementById('baseInput').value.trim();
        const fromBase = parseInt(document.getElementById('fromBase').value);
        const errorEl = document.getElementById('baseError');
        errorEl.textContent = '';

        // まず10進数に変換してから、各進数に変換する
        const decimal = parseInt(input, fromBase);

        // NaN = 変換できなかった（不正な文字が含まれている）
        if (isNaN(decimal) || decimal < 0) {
            errorEl.textContent = '入力が不正です。選択した進数に合った数値を入力してください。';
            ['res2','res8','res10','res16'].forEach(id => {
                document.getElementById(id).textContent = '—';
            });
            return;
        }

        document.getElementById('res2').textContent  = decimal.toString(2);
        document.getElementById('res8').textContent  = decimal.toString(8);
        document.getElementById('res10').textContent = decimal.toString(10);
        document.getElementById('res16').textContent = decimal.toString(16).toUpperCase();
    }

    document.getElementById('baseInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') convertBase();
    });

    // ============================================================
    // 素数判定
    // 2からその数の√まで割り切れるものがなければ素数
    // （√まででOKな理由：それ以上の因数は必ずペアが√以下にある）
    // ============================================================
    function isPrime(n) {
        if (n < 2) return false;
        if (n === 2) return true;
        if (n % 2 === 0) return false;
        for (let i = 3; i <= Math.sqrt(n); i += 2) {
            if (n % i === 0) return false;
        }
        return true;
    }

    function checkPrime() {
        const n = parseInt(document.getElementById('primeInput').value);
        const el = document.getElementById('primeVerdict');

        if (isNaN(n) || n < 1) {
            el.innerHTML = '<div class="prime-verdict not-prime">1以上の整数を入力してください</div>';
            return;
        }

        if (isPrime(n)) {
            el.innerHTML = `<div class="prime-verdict is-prime">${n} は素数です ✓</div>`;
        } else {
            // 素数じゃない場合は最小の因数も表示する
            let smallestFactor = n;
            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i === 0) { smallestFactor = i; break; }
            }
            el.innerHTML = `<div class="prime-verdict not-prime">${n} は素数ではありません　最小の因数: ${smallestFactor}</div>`;
        }
    }

    document.getElementById('primeInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') checkPrime();
    });

    function listPrimes() {
        const limit = parseInt(document.getElementById('primeListInput').value);
        const valueEl = document.getElementById('primeListValue');

        if (isNaN(limit) || limit < 2 || limit > 1000) {
            valueEl.textContent = '2〜1000の範囲で入力してください';
            return;
        }

        const primes = [];
        for (let i = 2; i <= limit; i++) {
            if (isPrime(i)) primes.push(i);
        }
        valueEl.textContent = primes.join('  ') + `　（${primes.length}個）`;
    }

    // ============================================================
    // 因数分解
    // 2から順番に割り続けて、割り切れた数を記録していく
    // ============================================================
    function factorize(n) {
        const factors = [];
        let current = n;
        for (let i = 2; i <= current; i++) {
            while (current % i === 0) {
                factors.push(i);
                current = current / i;
            }
        }
        return factors;
    }

    function doFactorize() {
        const n = parseInt(document.getElementById('factorInput').value);
        const display = document.getElementById('factorDisplay');

        if (isNaN(n) || n < 2) {
            display.innerHTML = '<p class="err">2以上の整数を入力してください</p>';
            return;
        }
        renderFactors(n, display);
    }

    document.getElementById('factorInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doFactorize();
    });

    // 因数分解の結果をHTMLで描画する
    function renderFactors(n, container) {
        const factors = factorize(n);

        // 同じ因数をまとめて指数表記にする（例：[2,2,3] → {2:2, 3:1}）
        const countMap = {};
        factors.forEach(function(f) {
            countMap[f] = (countMap[f] || 0) + 1;
        });

        // 表示用の式を作る
        const parts = Object.entries(countMap).map(function([base, exp]) {
            return exp > 1 ? `${base}<sup>${exp}</sup>` : `${base}`;
        });

        const equationHTML = `<span class="num">${n}</span> = ` + parts.join(' × ');

        // 素因数をバッジとして1つずつ表示（アニメーション付き）
        const badges = factors.map(function(f, i) {
            return `<span class="prime-badge" style="animation-delay:${i * 0.06}s">${f}</span>`;
        }).join('');

        container.innerHTML = `
            <div class="factor-equation">${equationHTML}</div>
            <div style="font-family:var(--mono);font-size:0.75rem;color:var(--dim);margin-bottom:8px;">素因数（重複あり）</div>
            <div class="prime-badges">${badges}</div>
            <div style="margin-top:14px;font-family:var(--mono);font-size:0.8rem;color:var(--dim);">
                素因数の種類: ${Object.keys(countMap).join(', ')} ／ 
                ${isPrime(n) ? '<span style="color:var(--accent)">この数は素数です</span>' : '合成数'}
            </div>
        `;
    }

    // ============================================================
    // ランダム因数分解ゲーム
    // ============================================================
    let currentGameNumber = null;

    function generateRandom() {
        // 2〜999のランダムな整数を生成
        currentGameNumber = Math.floor(Math.random() * 998) + 2;

        const numEl = document.getElementById('gameNumber');
        const ansEl = document.getElementById('gameAnswer');
        const hintEl = document.getElementById('gameHint');

        // グリッチアニメーション：一度クラスを外してからつけることでリセットする
        numEl.classList.remove('revealing');
        void numEl.offsetWidth; // reflowを強制してアニメーションをリセット
        numEl.classList.add('revealing');
        numEl.textContent = currentGameNumber;

        ansEl.className = 'game-answer';
        ansEl.textContent = 'この数を因数分解してみよう！';

        // 最小の因数をヒントとして表示
        const smallest = getSmallestFactor(currentGameNumber);
        hintEl.textContent = isPrime(currentGameNumber)
            ? 'ヒント：この数は素数かもしれない...'
            : `ヒント：最小の因数は ${smallest}`;
    }

    function getSmallestFactor(n) {
        for (let i = 2; i <= Math.sqrt(n); i++) {
            if (n % i === 0) return i;
        }
        return n; // 割り切れなければ素数なのでそのまま返す
    }

    function revealAnswer() {
        if (currentGameNumber === null) {
            document.getElementById('gameAnswer').textContent = 'まず「ランダム生成」を押してください';
            return;
        }

        const factors = factorize(currentGameNumber);
        const countMap = {};
        factors.forEach(function(f) { countMap[f] = (countMap[f] || 0) + 1; });

        const parts = Object.entries(countMap).map(function([base, exp]) {
            return exp > 1 ? `${base}^${exp}` : `${base}`;
        });

        const ansEl = document.getElementById('gameAnswer');
        const hintEl = document.getElementById('gameHint');

        ansEl.className = 'game-answer show';

        if (isPrime(currentGameNumber)) {
            ansEl.textContent = `${currentGameNumber} は素数！分解できない`;
        } else {
            ansEl.textContent = `${currentGameNumber} = ${parts.join(' × ')}`;
        }

        hintEl.textContent = `素因数（全部）: ${factors.join(', ')}`;
    }
</script>
</body>
</html>
